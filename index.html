<!DOCTYPE html>
<html lang="id" data-theme="light">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SYNQRA – Intelligence Connected by Evidence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --n9: #0B1F44;
      --n8: #13315C;
      --n7: #1E4B6B;
      --c5: #00B8D9;
      --c6: #007A94;
      --c3: #7FDFFF;
      --bg-outer: #E2E8F0;
      --bg-shell: #F5F8FA;
      --panel: #FFFFFF;
      --card: #F8FAFC;
      --pill-bg: #EDF2F7;
      --tx: #0B1F44;
      --tx2: #334E68;
      --bd: #CBD5E1;
      --chip: #E0F7FA;
      --peach: #FFF3E0;
      --ptx: #7C2D12;
      --ok: #059669;
      --dug: #D97706;
      --buk: #EA580C;
      --nm: #DC2626;
      --ars: #475569;
      --sh-sm: 0 2px 8px rgba(11, 31, 68, .05);
      --sh-md: 0 8px 24px rgba(11, 31, 68, .07);
      --sh-lg: 0 16px 40px rgba(11, 31, 68, .10);
      box-sizing: border-box;
    }

    :root[data-contrast="outdoor"] {
      --bg-outer: #FFFFFF;
      --bg-shell: #FFFFFF;
      --panel: #FFFFFF;
      --card: #F1F5F9;
      --pill-bg: #E2E8F0;
      --tx: #051026;
      --tx2: #0B1F44;
      --bd: #64748B;
      --sh-sm: none;
      --sh-md: 0 0 0 1.5px #0B1F44;
    }

    * {
      box-sizing: border-box
    }

    html {
      scroll-behavior: smooth
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg-outer);
      color: var(--tx);
      font: 15px/1.55 'Montserrat', system-ui, sans-serif;
      font-feature-settings: 'tnum';
      padding: clamp(8px, 1.6vw, 20px)
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
      color: inherit
    }

    button {
      cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease, background-color .15s ease
    }

    button:active:not(:disabled) {
      transform: scale(.98)
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible {
      outline: 2px solid var(--n9);
      outline-offset: 2px;
      box-shadow: 0 0 0 4px var(--c3)
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(10px)
      }

      to {
        opacity: 1;
        transform: translateY(0)
      }
    }

    .anim {
      animation: fadeUp .3s cubic-bezier(.2, .8, .2, 1) both
    }

    /* Shell & Top Header */
    #shell {
      max-width: 1460px;
      margin: 0 auto;
      background: var(--bg-shell);
      border-radius: 32px;
      padding: clamp(14px, 2vw, 26px);
      box-shadow: var(--sh-lg);
      border: 1px solid var(--bd)
    }

    #topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      background: var(--panel);
      border-radius: 999px;
      padding: 10px 18px 10px 20px;
      box-shadow: var(--sh-sm);
      margin-bottom: 22px;
      border: 1px solid var(--bd);
      flex-wrap: wrap
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      border: 0;
      background: none;
      padding: 2px 6px;
      text-align: left
    }

    .brand svg {
      width: 42px;
      height: 42px;
      flex: none
    }

    .brand-tx {
      display: block;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: .03em;
      color: var(--n9);
      line-height: 1.05
    }

    .brand-sub {
      display: block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: .08em;
      color: var(--n7);
      text-transform: uppercase;
      margin-top: 2px
    }

    .top-act {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1.5px solid var(--bd);
      background: var(--panel);
      color: var(--tx);
      border-radius: 999px;
      padding: 9px 18px;
      font-size: 14px;
      font-weight: 600;
      min-height: 44px;
      box-shadow: var(--sh-sm)
    }

    .pill:hover:not(:disabled) {
      background: var(--pill-bg)
    }

    .pill.pr {
      background: var(--n9);
      border-color: var(--n9);
      color: #FFFFFF;
      font-weight: 700
    }

    .pill.cy {
      background: var(--c5);
      border-color: var(--c5);
      color: #0B1F44;
      font-weight: 700
    }

    .pill:disabled {
      opacity: .45;
      cursor: not-allowed
    }

    .ib {
      position: relative;
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--pill-bg);
      border: 1px solid var(--bd);
      color: var(--tx)
    }

    .ib .dot {
      position: absolute;
      top: 8px;
      right: 9px;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--buk);
      border: 2px solid var(--panel)
    }

    .usr {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--pill-bg);
      border: 1px solid var(--bd);
      border-radius: 999px;
      padding: 5px 14px 5px 6px;
      font-size: 14px;
      font-weight: 700
    }

    .av {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--n9);
      color: #FFFFFF;
      font-size: 13px;
      font-weight: 700
    }

    svg.i {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex: none
    }

    /* Subbar */
    #subbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      padding: 0 4px
    }

    #subbar h1 {
      margin: 0;
      font-size: clamp(22px, 2.6vw, 30px);
      font-weight: 800;
      letter-spacing: -.02em;
      color: var(--tx)
    }

    #subbar h1 span {
      font-weight: 500;
      color: var(--tx2)
    }

    /* Layout Workspace: Sidebar Kiri ala MyITS + Konten Utama */
    #work {
      display: grid;
      grid-template-columns: 255px minmax(0, 1fr);
      gap: 22px;
      align-items: start
    }

    #side {
      background: var(--panel);
      border-radius: 24px;
      padding: 16px 12px;
      box-shadow: var(--sh-md);
      border: 1px solid var(--bd);
      position: sticky;
      top: 16px
    }

    .s-grp {
      font-size: 11.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--tx2);
      padding: 10px 12px 6px
    }

    .s-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      border: 0;
      background: transparent;
      color: var(--tx);
      padding: 11px 14px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 600;
      text-align: left;
      margin-bottom: 3px
    }

    .s-btn:hover {
      background: var(--pill-bg)
    }

    .s-btn.on {
      background: var(--n9);
      color: #FFFFFF;
      font-weight: 700
    }

    .s-btn .cnt {
      margin-left: auto;
      font-size: 12px;
      font-weight: 700;
      background: var(--pill-bg);
      color: var(--tx);
      padding: 2px 8px;
      border-radius: 99px
    }

    .s-btn.on .cnt {
      background: var(--c5);
      color: #0B1F44
    }

    /* Kartu, Grid & Komponen */
    .wcard,
    .cd {
      background: var(--panel);
      border-radius: 24px;
      padding: 22px 24px;
      box-shadow: var(--sh-md);
      border: 1px solid var(--bd)
    }

    .kpi4 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 16px;
      margin-bottom: 20px
    }

    .kbox {
      background: var(--panel);
      border: 1px solid var(--bd);
      border-radius: 20px;
      padding: 18px 20px;
      box-shadow: var(--sh-sm)
    }

    .kbox small {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--tx2);
      margin-bottom: 6px
    }

    .kbox b {
      font-size: 32px;
      font-weight: 800;
      color: var(--tx);
      line-height: 1.1
    }

    .kbox span {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--tx2);
      margin-top: 4px
    }

    .dg {
      display: grid;
      gap: 20px;
      grid-template-columns: minmax(0, 1.8fr) minmax(0, 1fr);
      align-items: start
    }

    .row2 {
      display: grid;
      gap: 20px;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr));
      margin-bottom: 20px
    }

    .row3 {
      display: grid;
      gap: 18px;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr));
      margin-bottom: 20px
    }

    .chd {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap
    }

    .chd h2,
    h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
      color: var(--tx)
    }

    .csub {
      display: block;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--tx2);
      margin-top: 3px
    }

    .top {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 18px
    }

    .top h1 {
      margin: 0;
      flex: 1;
      min-width: 200px;
      font-size: clamp(21px, 2.4vw, 28px);
      font-weight: 800;
      color: var(--tx)
    }

    .top h1 span {
      font-weight: 500;
      color: var(--tx2)
    }

    .bk {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1.5px solid var(--bd);
      background: var(--panel);
      color: var(--tx);
      border-radius: 999px;
      padding: 0 16px;
      min-height: 42px;
      font-size: 14px;
      font-weight: 700
    }

    /* Badge Semantik & Psikologi Warna */
    .bd {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      padding: 5px 12px;
      font-size: 12.5px;
      font-weight: 700;
      white-space: nowrap
    }

    .bd.dug {
      background: #FEF3C7;
      color: #92400E;
      border: 1px solid #FDE68A
    }

    .bd.ver {
      background: #D1FAE5;
      color: #065F46;
      border: 1px solid #A7F3D0
    }

    .bd.bukti {
      background: #FFEDD5;
      color: #9A3412;
      border: 1px solid #FED7AA
    }

    .bd.nm {
      background: #FEE2E2;
      color: #991B1B;
      border: 1px solid #FECACA
    }

    .bd.ars {
      background: #E2E8F0;
      color: #334155;
      border: 1px solid #CBD5E1
    }

    .bd.info {
      background: var(--chip);
      color: var(--n9);
      border: 1px solid var(--c3)
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      background: var(--pill-bg);
      padding: 5px;
      border-radius: 16px;
      margin-bottom: 18px;
      width: fit-content;
      max-width: 100%
    }

    .tabs button {
      border: 0;
      background: none;
      border-radius: 12px;
      padding: 8px 16px;
      min-height: 40px;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--tx2)
    }

    .tabs button:hover {
      color: var(--tx)
    }

    .tabs .on {
      background: var(--n9);
      color: #FFFFFF;
      font-weight: 700;
      box-shadow: var(--sh-sm)
    }

    /* Tabel & Item */
    .tbl-wrap {
      overflow-x: auto
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0 8px;
      font-size: 14px
    }

    th {
      text-align: left;
      font-size: 13px;
      font-weight: 700;
      color: var(--tx2);
      padding: 6px 14px
    }

    td {
      padding: 14px;
      background: var(--card);
      color: var(--tx);
      font-weight: 500;
      border-top: 1px solid var(--bd);
      border-bottom: 1px solid var(--bd)
    }

    td:first-child {
      border-left: 1px solid var(--bd);
      border-radius: 14px 0 0 14px
    }

    td:last-child {
      border-right: 1px solid var(--bd);
      border-radius: 0 14px 14px 0;
      text-align: right
    }

    .it {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 10px;
      border-bottom: 1px solid var(--bd);
      width: 100%;
      background: none;
      border-left: 0;
      border-right: 0;
      border-top: 0;
      text-align: left;
      border-radius: 12px
    }

    .it:hover {
      background: var(--card)
    }

    .it:last-child {
      border-bottom: 0
    }

    .it>i {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--chip);
      color: var(--n9);
      font-style: normal;
      font-weight: 800;
      font-size: 14px;
      flex: none
    }

    .it span {
      flex: 1;
      min-width: 0;
      font-size: 14.5px;
      font-weight: 700;
      color: var(--tx)
    }

    .it span small {
      display: block;
      font-weight: 500;
      color: var(--tx2);
      font-size: 13px;
      margin-top: 3px
    }

    .ch {
      border-radius: 999px;
      padding: 4px 11px;
      font-weight: 700;
      font-size: 13px;
      background: var(--chip);
      color: var(--n9)
    }

    .mu {
      color: var(--tx2) !important;
      font-weight: 500 !important
    }

    .nt {
      margin: 14px 0 0;
      padding: 14px 16px;
      border-radius: 14px;
      font-size: 13.5px;
      font-weight: 600;
      color: #7C2D12;
      background: #FEF3C7;
      border: 1px solid #FDE68A
    }

    /* Form, Input, Radio Cards & Upload */
    .lbl {
      display: block;
      font-size: 13.5px;
      font-weight: 700;
      color: var(--tx);
      margin: 14px 0 6px
    }

    .in2,
    select,
    textarea {
      width: 100%;
      border: 1.5px solid var(--bd);
      background: var(--card);
      color: var(--tx);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 14px;
      min-height: 44px
    }

    textarea {
      min-height: 84px;
      resize: vertical
    }

    .rc-grid {
      display: grid;
      gap: 10px;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr))
    }

    .rc {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px 14px;
      border: 1.5px solid var(--bd);
      border-radius: 14px;
      background: var(--card);
      cursor: pointer;
      font-size: 13.5px;
      font-weight: 600
    }

    .rc input {
      width: 18px;
      height: 18px;
      margin-top: 2px;
      accent-color: var(--n9);
      flex: none
    }

    .rc.on {
      border-color: var(--n9);
      background: var(--chip)
    }

    .up-box {
      border: 2px dashed var(--bd);
      border-radius: 16px;
      padding: 18px;
      text-align: center;
      background: var(--card);
      margin-top: 8px
    }

    .ec {
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 12px
    }

    .hh {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      font-weight: 700;
      font-size: 14.5px
    }

    /* Stepper 5 Tahap Triage & 8 Modul Investigasi */
    .stp {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 8px;
      margin: 14px 0
    }

    .st-i {
      padding: 10px 12px;
      border-radius: 12px;
      border: 1.5px solid var(--bd);
      background: var(--card);
      font-size: 12.5px;
      font-weight: 600
    }

    .st-i b {
      display: block;
      font-size: 13px;
      margin-bottom: 2px
    }

    .st-i.done {
      border-color: var(--ok);
      background: #ECFDF5;
      color: #065F46
    }

    .st-i.cur {
      border-color: var(--n9);
      background: var(--chip);
      color: var(--n9)
    }

    /* Spesifikasi Peralatan (Tanpa kata Pohon & Tanpa Emoji) */
    .trb {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
      border: 1px solid transparent;
      background: transparent;
      padding: 10px 14px;
      border-radius: 12px;
      text-align: left;
      font-size: 14px;
      font-weight: 600;
      color: var(--tx)
    }

    .trb:hover {
      background: var(--pill-bg)
    }

    .trb.on {
      background: var(--n9);
      color: #FFFFFF;
      font-weight: 700
    }

    .trb.on .mu {
      color: var(--c3) !important
    }

    .trc {
      margin-left: 16px;
      padding-left: 14px;
      border-left: 2px solid var(--bd);
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 4px;
      margin-bottom: 6px
    }

    .tg {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--card);
      border: 1px solid var(--bd);
      border-radius: 10px;
      padding: 6px 12px;
      font-size: 13.5px;
      font-weight: 600
    }

    .fgr {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 10px
    }

    .fgr .in2 {
      flex: 1;
      min-width: 150px
    }

    /* Grafik & Knowledge Graph */
    .pchart-grid {
      position: relative;
      height: 200px;
      display: flex;
      align-items: flex-end;
      justify-content: space-around;
      padding: 0 10px 28px 34px;
      border-bottom: 1.5px solid var(--bd)
    }

    .pbar-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      height: 100%;
      flex: 1;
      position: relative
    }

    .pbar {
      width: clamp(30px, 3.8vw, 46px);
      border-radius: 10px 10px 0 0;
      background: var(--pill-bg);
      border: 1.5px solid var(--n7);
      display: flex;
      flex-direction: column-reverse;
      overflow: hidden
    }

    .pbar u {
      display: block;
      width: 100%;
      background: var(--n9)
    }

    .pbar-lbl {
      position: absolute;
      bottom: -24px;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--tx2)
    }

    .gw {
      overflow-x: auto;
      padding-bottom: 6px
    }

    .gw svg {
      min-width: 640px;
      width: 100%;
      height: auto;
      display: block
    }

    .gw text {
      fill: var(--tx);
      font-size: 11px;
      font-weight: 700
    }

    .gw .lb2 {
      font-size: 10px;
      font-weight: 600;
      fill: var(--tx2)
    }

    .gn {
      cursor: pointer
    }

    .ck {
      display: flex;
      gap: 10px;
      align-items: center;
      min-height: 40px;
      font-size: 14px;
      font-weight: 600
    }

    .ck input {
      width: 18px;
      height: 18px;
      accent-color: var(--n9)
    }

    /* Galeri Foto Insiden Jurnal */
    .inc-grid {
      display: grid;
      gap: 14px;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      margin-top: 12px
    }

    .inc-card {
      border: 1.5px solid var(--bd);
      border-radius: 16px;
      overflow: hidden;
      background: var(--card)
    }

    .inc-card svg {
      width: 100%;
      height: 130px;
      display: block;
      background: #0B1F44
    }

    .inc-body {
      padding: 12px 14px;
      font-size: 13px
    }

    .inc-body b {
      display: block;
      font-size: 14px;
      margin-bottom: 4px;
      color: var(--tx)
    }

    #ts {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 24px;
      background: var(--n9);
      color: #FFFFFF;
      border: 2px solid var(--c3);
      padding: 12px 20px;
      border-radius: 999px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
      z-index: 60;

        unit = typ.un.find(u => u.tag == KSEL.u) || typ.un[0];

      const listH = cats.map(c => {
        const op = KOPEN[c.id], cnt = c.ty.reduce((s, t) => s + t.un.length, 0);
        return `<div>
      <button class="trb ${KSEL.c == c.id && !KSEL.u ? 'on' : ''}" data-kc="${c.id}">
        <span><b>${esc(c.n)}</b><small style="display:block;font-size:12px" class="mu">${c.sc} · ${cnt} unit</small></span>
        <span>${op ? '▾' : '▸'}</span>
      </button>
      ${op ? `<div class="trc">${c.ty.map(t => `
        <div>
          <div style="font-size:13px;font-weight:700;color:var(--tx2);padding:6px 10px">${esc(t.n)} (${t.un.length})</div>
          <div class="trc">${t.un.map(u => {
          const on = KSEL.c == c.id && KSEL.t == t.id && KSEL.u == u.tag;
          return `<button class="trb ${on ? 'on' : ''}" data-ku="${c.id}|${t.id}|${u.tag}" style="padding:8px 12px">
              <span>${esc(u.tag)} <small class="mu">(${u.cm.length} komponen)</small></span>
            </button>`;
        }).join('')}</div>
        </div>
      `).join('')}</div>` : ''}
    </div>`;
      }).join('');

      $('#mv').innerHTML = `
    <div class="wcard" style="margin-bottom:20px">
      <div class="chd" style="margin-bottom:10px">
        <div><h2>Filter Hak Akses Departemen</h2><span class="csub">${DP[KDP].d}</span></div>
      </div>
      <div class="tabs" style="margin:0">
        ${Object.entries(DP).map(([k, v]) => `<button data-kdp="${k}" class="${KDP == k ? 'on' : ''}">${v.n}</button>`).join('')}
      </div>
    </div>

    <div class="dg">
      <section class="wcard">
        <h2>Spesifikasi Peralatan</h2>
        <span class="csub" style="margin-bottom:14px">Kategori › Jenis Peralatan › Tag Unit › Komponen</span>
        <div style="display:flex;flex-direction:column;gap:4px">${listH}</div>
      </section>

      <section class="wcard">
        <div class="chd">
          <div>
            <small class="mu">${esc(cat.n)} › ${esc(typ.n)}</small>
            <h2 style="font-size:22px;margin-top:4px">${esc(unit.tag)} (${esc(typ.n)})</h2>
          </div>
          <span class="bd info">${cat.sc}</span>
        </div>

        <label class="lbl">1. Daftar Komponen pada ${esc(unit.tag)} (${unit.cm.length})</label>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          ${unit.cm.map((c, i) => `<span class="tg">${esc(c)} <button data-ka="del-cm" data-i="${i}" style="border:0;background:none;font-weight:800;color:var(--tx2)" title="Hapus">×</button></span>`).join('')}
        </div>
        <div class="fgr">
          <input class="in2" id="ncm" placeholder="Nama komponen baru…">
          <button class="pill" data-ka="add-cm">+ Tambah Komponen</button>
        </div>

        <label class="lbl">2. Mode Kegagalan & Gejala Terkait</label>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          ${unit.fm.map((f, i) => `<span class="tg">${esc(f)} <button data-ka="del-fm" data-i="${i}" style="border:0;background:none;font-weight:800;color:var(--tx2)">×</button></span>`).join('')}
        </div>
        <div class="fgr">
          <input class="in2" id="nfm" placeholder="Tambah mode kegagalan baru…">
          <button class="pill" data-ka="add-fm">+ Tambah Mode Kegagalan</button>
        </div>

        <label class="lbl">3. Parameter Kondisi Operasi Standar</label>
        <div style="display:grid;gap:8px;margin-top:8px">
          ${cat.op.map(([p, u, r]) => `<div style="display:flex;justify-content:space-between;background:var(--card);padding:10px 14px;border-radius:12px;border:1px solid var(--bd);font-size:14px"><b>${esc(p)} (${esc(u)})</b><span>Rentang Normal: <b>${esc(r)} ${esc(u)}</b></span></div>`).join('')}
        </div>
      </section>
    </div>`;
    }

    function renderAnalitik() {
      $('#pg-title').innerHTML = 'Analitik & Peta Keberulangan <span>· Evaluasi Status Pengetahuan & Klasifikasi CCPS</span>';
      const ccpsCnt = ['Abnormal Operating Condition', 'Suspected Equipment Failure', 'Potential Hazard / Unsafe Condition', 'Near Miss'].map(c => [c, PRE.filter(p => p.ccps == c).length + DB.filter(k => k.ccps == c).length]);
      $('#mv').innerHTML = `
    <div class="row2">
      <section class="wcard">
        <h2>Distribusi Klasifikasi Temuan (CCPS)</h2>
        <span class="csub" style="margin-bottom:14px">Membedakan Abnormality, Suspected Failure, Potential Hazard, dan Near Miss</span>
        ${ccpsCnt.map(([c, n]) => `<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd)">${CCPS_BG(c)}<b>${n} Laporan/Kasus</b></div>`).join('')}
      </section>
      <section class="wcard">
        <h2>Peta Keberulangan Kasus per Unit</h2>
        <span class="csub" style="margin-bottom:14px">Memantau jeda waktu antar kejadian berulang pada aset kritis</span>
        <div class="ec"><b>P-101A (Pompa Sentrifugal)</b><p style="margin:6px 0 0;font-size:14px">3 kejadian tercatat (K-014, K-021, K-033) dengan jeda keberulangan <b>8 bulan</b> dan <b>9 bulan</b>.</p></div>
        <div class="ec"><b>E-201 / E-202 (Heat Exchanger)</b><p style="margin:6px 0 0;font-size:14px">2 kasus selesai (K-009, K-027) dan 1 indikasi fouling aktif dalam Triage (PR-102).</p></div>
      </section>
    </div>`;
    }

    function renderPanduan() {
      $('#pg-title').innerHTML = 'Buku Panduan & Psikologi Warna <span>· Standar Penggunaan Sistem & Brand Guideline</span>';
      $('#mv').innerHTML = `
    <div class="row2">
      <section class="wcard">
        <h2>Panduan Alur Kerja Dua Tingkat (Two-Tier Workflow)</h2>
        <ol style="line-height:1.8;font-size:14px;padding-left:20px">
          <li><b>Preliminary Report (Early Warning):</b> Digunakan teknisi/operator di HP atau komputer untuk melaporkan kejanggalan awal, kondisi abnormal, potensi bahaya, atau <i>near miss</i> beserta foto awal. Seluruh ekstraksi AI berstatus <b>Praduga</b>.</li>
          <li><b>Triage & Penetapan HSE:</b> Menyaring laporan melalui 5 tahap. HSE menetapkan apakah laporan cukup <b>Auto-Closed</b> (loncat langsung ke tahap 5 bila aman), <b>Monitoring</b>, <b>Perlu Verifikasi</b>, atau <b>Investigasi Lanjutan</b>.</li>
          <li><b>Full Investigation Workspace (8 Modul):</b> Menggabungkan bukti fisik, foto insiden, checklist <b>P&ID</b> dan <b>HAZOP</b>, analisis <b>RCA/FMEA</b>, <b>Matriks Risiko 5×5</b>, dan <b>CAPA</b>. Hanya kasus yang disahkan di Modul 7 yang masuk ke <b>Knowledge Base</b>.</li>
        </ol>
      </section>
      <section class="wcard">
        <h2>Psikologi & Makna Warna Resmi SYNQRA</h2>
        <div style="display:grid;gap:10px;margin-top:10px;font-size:13.5px">
          <div style="padding:10px 14px;border-radius:12px;background:#0B1F44;color:#fff"><b>Deep Navy (#0B1F44):</b> Stabilitas, otoritas keteknikan, kepercayaan, dan fokus mata.</div>
          <div style="padding:10px 14px;border-radius:12px;background:#1E4B6B;color:#fff"><b>Steel Blue (#1E4B6B):</b> Konteks rekayasa proses dan keandalan struktur industri.</div>
          <div style="padding:10px 14px;border-radius:12px;background:#00B8D9;color:#0B1F44"><b>Tech Cyan (#00B8D9):</b> Inovasi AI, ekstraksi informasi, dan konektivitas bukti.</div>
          <div style="padding:10px 14px;border-radius:12px;background:#F5F8FA;color:#0B1F44;border:1px solid var(--bd)"><b>Soft White (#F5F8FA):</b> Ruang kerja terang untuk mencegah kelelahan mata dan menjaga keterbacaan di bawah sinar matahari lapangan.</div>
        </div>
      </section>
    </div>`;
    }

    /* Event Delegation untuk Seluruh Interaksi */
    $('#mv').addEventListener('click', e => {
      const htab = e.target.closest('[data-htab]'),
        pra = e.target.closest('[data-pra]'),
        trdp = e.target.closest('[data-trdp]'),
        trsel = e.target.closest('[data-trsel]'),
        tra = e.target.closest('[data-tra]'),
        itab = e.target.closest('[data-itab]'),
        ina = e.target.closest('[data-ina]'),
        kf = e.target.closest('[data-kf]'),
        gn = e.target.closest('[data-g]'),
        qa = e.target.closest('[data-qa]'),
        kdp = e.target.closest('[data-kdp]'),
        kc = e.target.closest('[data-kc]'),
        ku = e.target.closest('[data-ku]'),
        ka = e.target.closest('[data-ka]');

      if (htab) { H_TAB = htab.dataset.htab; renderHome(); return }
      if (pra) {
        const act = pra.dataset.pra;
        if (act == 'sample') { PR_ST.text = SM_PRE[PR_ST.asset] || SM_PRE['P-101A']; PR_ST.text = PR_ST.text.replace(/\{[^|]+\|([^}]+)\}/g, '$1'); renderPrelim() }
        else if (act == 'voice') { PR_ST.text = (SM_PRE[PR_ST.asset] || SM_PRE['P-101A']).replace(/\{[^|]+\|([^}]+)\}/g, '$1'); tst('Transkrip suara selesai diproses.'); renderPrelim() }
        else if (act == 'del-ev') { PR_ST.evFiles.splice(+pra.dataset.i, 1); renderPrelim() }
        else if (act == 'next') { if (PR_ST.text.trim().length < 10) return tst('Isi deskripsi indikasi awal terlebih dahulu.'); PR_ST.ex = extractPrelim(PR_ST.text, PR_ST.asset); PR_ST.step = 2; renderPrelim(); scrollTo(0, 0) }
        else if (act == 'back') { PR_ST.step = 1; renderPrelim() }
        else if (act == 'submit') {
          const nid = 'PR-' + (PRE.length + 101);
          PRE.unshift({ id: nid, tag: PR_ST.asset, dp: PR_ST.dp, dt: '13 Nov 2026', ccps: PR_ST.ccps, urg: PR_ST.urg, st: 2, stLbl: 'Under Triage', disp: 'Menunggu Penetapan HSE', g: PR_ST.ex[1].v || 'Indikasi abnormal dilaporkan', kd: PR_ST.ex[2].v, iv: PR_ST.ex[3].v, cs: PR_ST.ex[4].v, ac: PR_ST.ex[5].v, vf: '', ev: [...PR_ST.evFiles], note: 'Laporan baru masuk ke antrean Triage.', linked: '' });
          PR_ST.step = 1; TR_SEL = nid; tst(nid + ' berhasil dikirim ke Triage & Preliminary Assessment.'); location.hash = 'triage';
        }
        return;
      }
      if (trdp) { TR_DP = trdp.dataset.trdp; renderTriage(); return }
      if (trsel) { TR_SEL = trsel.dataset.trsel; renderTriage(); return }
      if (tra && tra.dataset.tra == 'save') {
        const cur = PRE.find(p => p.id == TR_SEL); if (!cur) return;
        const dec = document.querySelector('input[name="hse-dec"]:checked')?.value || 'mon';
        cur.note = $('#tr-note').value.trim();
        if (dec == 'mon') { cur.st = 3; cur.stLbl = 'Under Monitoring / Verification'; cur.disp = 'Monitoring' }
        else if (dec == 'ver') { cur.st = 3; cur.stLbl = 'Under Monitoring / Verification'; cur.disp = 'Perlu Verifikasi' }
        else if (dec == 'cls') { cur.st = 5; cur.stLbl = 'Closed — With Disposition'; cur.disp = 'Auto-Closed (Ditutup HSE)' }
        else if (dec == 'inv') {
          cur.st = 4; cur.stLbl = 'Investigation Required'; cur.disp = 'Investigasi Lanjutan';
          if (!cur.linked) {
            const kid = 'K-0' + (DB.length + 30); cur.linked = kid;
            DB.unshift({ id: kid, a: cur.tag[0], tag: cur.tag, dp: cur.dp, g: cur.g.slice(0, 45), st: 'dug', ev: cur.ev.length, d: '2026-11', m: 29, ccps: cur.ccps });
            CD[kid] = { g: cur.g, kd: cur.kd, iv: cur.iv, cs: cur.cs, ac: cur.ac, vf: '', obj: 'Investigasi lanjutan eskalasi dari ' + cur.id, docs: { pid: 1, hazop: 0, op: 1, insp: 0, maint: 0 }, haz: { node: 'Node ' + cur.tag, param: 'Parameter Operasi', gw: 'More', dev: cur.g, cause: cur.cs, cons: 'Potensi gangguan operasi', safe: 'Alarm & inspeksi lokal', rec: cur.ac }, fa: { m: 'Root Cause Analysis (RCA)', prob: cur.g, fact: cur.kd, find: cur.iv, root: cur.cs }, risk: { il: 3, ic: 3, rl: 2, rc: 2, mit: cur.ac }, capa: [{ id: 'ACT-01', act: cur.ac || 'Verifikasi teknis lapangan', pic: cur.dp, dt: '2026-11-28', st: 'In Progress' }], rev: { rev: 'Rina (HSE Validator)', conc: 'Menunggu kelengkapan bukti investigasi.', st: 'Pending Review', ck: [0, 0, 1, 1, 0] }, bk: cur.ev.map(f => ['Foto', f, 'gejala']) };
          }
        }
        tst('Penetapan HSE untuk ' + cur.id + ' disimpan: ' + cur.disp); renderTriage(); return;
      }
      if (itab) { INV_TAB = +itab.dataset.itab; renderInvestigation(); return }
      if (ina) {
        const act = ina.dataset.ina, k = DB.find(x => x.id == INV_ID) || DB[0], c = CD[k.id];
        if (act == 'prev' && INV_TAB > 1) { INV_TAB--; renderInvestigation() }
        else if (act == 'next' && INV_TAB < 8) { INV_TAB++; renderInvestigation() }
        else if (act == 'save-ov') { c.g = $('#ov-g').value; k.g = c.g; c.kd = $('#ov-kd').value; c.obj = $('#ov-obj').value; c.iv = $('#ov-iv').value; c.cs = $('#ov-cs').value; tst('Overview ' + k.id + ' disimpan.') }
        else if (act == 'add-bk') { const n = $('#nbk-n').value.trim(); if (!n) return tst('Isi nama dokumen/bukti.'); c.bk.push([$('#nbk-t').value, n, $('#nbk-s').value]); k.ev = c.bk.length; tst('Dokumen bukti berhasil ditambahkan.'); renderInvestigation() }
        else if (act == 'save-haz') { c.haz = { node: $('#hz-node').value, param: $('#hz-param').value, gw: $('#hz-gw').value, dev: $('#hz-dev').value, cause: $('#hz-cause').value, cons: $('#hz-cons').value, safe: $('#hz-safe').value, rec: $('#hz-rec').value }; c.docs.hazop = 1; tst('Worksheet HAZOP disimpan.') }
        else if (act == 'save-fa') { c.fa = { m: $('#fa-m').value, prob: $('#fa-prob').value, fact: $('#fa-fact').value, find: $('#fa-find').value, root: $('#fa-root').value }; c.cs = c.fa.root; tst('Analisis kegagalan disimpan.') }
        else if (act == 'save-rk') { c.risk = { il: +$('#rk-il').value, ic: +$('#rk-ic').value, rl: +$('#rk-rl').value, rc: +$('#rk-rc').value, mit: $('#rk-mit').value }; tst('Matriks penilaian risiko diperbarui.'); renderInvestigation() }
        else if (act == 'add-capa') { const a = $('#cp-act').value.trim(); if (!a) return tst('Isi tindakan korektif.'); c.capa.push({ id: 'ACT-0' + (c.capa.length + 1), act: a, pic: $('#cp-pic').value || 'Engineering', dt: $('#cp-dt').value, st: 'In Progress' }); c.vf = $('#cp-vf').value; renderInvestigation(); tst('Tindakan CAPA ditambahkan.') }
        else if (act == 'approve') { if (!c.bk.length) return tst('Wajib ada bukti tertaut sebelum disahkan.'); c.rev.conc = $('#rv-conc').value; k.st = 'ver'; c.rev.st = 'Approved & Verified'; tst(k.id + ' resmi disahkan dan masuk ke Knowledge Base!'); renderInvestigation(); renderSide('investigasi') }
        else if (act == 'req-ev') { c.rev.conc = $('#rv-conc').value; k.st = 'bukti'; c.rev.st = 'Revision Required'; tst(k.id + ' ditetapkan Perlu Bukti Tambahan.'); renderInvestigation() }
        return;
      }
      if (kf) { KF = kf.dataset.kf; renderKasus(); return }
      if (gn) { GS = gn.dataset.g; renderGraf(); return }
      if (qa) { QS = $('#qi').value; QA = qa.dataset.qa; renderCari(); return }
      if (kdp) { KDP = kdp.dataset.kdp; $('#dpb').textContent = 'Departemen: ' + DP[KDP].n; renderKonfig(); return }
      if (kc) { const id = kc.dataset.kc; KOPEN[id] = !KOPEN[id]; KSEL.c = id; renderKonfig(); return }
      if (ku) { const [c, t, u] = ku.dataset.ku.split('|'); KSEL = { c, t, u }; renderKonfig(); return }
      if (ka) {
        const act = ka.dataset.ka, cat = EQ.find(c => c.id == KSEL.c) || EQ[0], typ = cat.ty.find(t => t.id == KSEL.t) || cat.ty[0], unit = typ.un.find(u => u.tag == KSEL.u) || typ.un[0];
        if (act == 'add-cm') { const v = $('#ncm').value.trim(); if (!v) return; unit.cm.push(v); tst('Komponen ditambahkan.'); renderKonfig() }
        else if (act == 'del-cm') { unit.cm.splice(+ka.dataset.i, 1); renderKonfig() }
        else if (act == 'add-fm') { const v = $('#nfm').value.trim(); if (!v) return; unit.fm.push(v); tst('Mode kegagalan ditambahkan.'); renderKonfig() }
        else if (act == 'del-fm') { unit.fm.splice(+ka.dataset.i, 1); renderKonfig() }
      }
    });

    $('#mv').addEventListener('change', e => {
      const doc = e.target.closest('[data-doc]'), rvck = e.target.closest('[data-rvck]');
      if (doc) { CD[INV_ID].docs[doc.dataset.doc] = doc.checked ? 1 : 0; renderInvestigation() }
      else if (rvck) { CD[INV_ID].rev.ck[+rvck.dataset.rvck] = rvck.checked ? 1 : 0 }
    });
    $('#mv').addEventListener('input', e => {
      if (e.target.dataset.prei !== undefined) PR_ST.ex[+e.target.dataset.prei].v = e.target.value;
    });

    function route() {
      const h = location.hash.slice(1) || 'beranda';
      if (h.startsWith('triage-')) { TR_SEL = h.slice(7).toUpperCase(); renderSide('triage'); renderTriage(); scrollTo(0, 0); return }
      if (h.startsWith('inv-')) { INV_ID = h.slice(4).toUpperCase(); renderSide('investigasi'); renderInvestigation(); scrollTo(0, 0); return }
      const map = {
        beranda: renderHome,
        prelim: renderPrelim,
        triage: renderTriage,
        investigasi: renderInvestigation,
        kasus: renderKasus,
        graf: renderGraf,
        cari: renderCari,
        konfig: renderKonfig,
        analitik: renderAnalitik,
        panduan: renderPanduan
      };
      const fn = map[h] || renderHome;
      renderSide(map[h] ? h : 'beranda');
      fn();
      scrollTo(0, 0);
    }
    addEventListener('hashchange', route);
    route();
  </script>
</body>

</html>
