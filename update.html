<!DOCTYPE html>
<html lang="id" data-theme="light">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>SYNQRA – Intelligence Connected by Evidence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --n9: #0B1F44;
            --n8: #13315C;
            --n7: #1E4B6B;
            --c5: #00B8D9;
            --c6: #007A94;
            --c3: #7FDFFF;
            --bg-outer: #E6ECF2;
            --bg-shell: #F5F8FA;
            --panel: #FFFFFF;
            --card: #F8FAFC;
            --pill-bg: #EDF2F7;
            --tx: #0B1F44;
            --tx2: #334E68;
            --bd: #CBD5E1;
            --chip: #E0F7FA;
            --ok: #10B981;
            --dug: #F59E0B;
            --buk: #F97316;
            --err: #EF4444;
            --ars: #64748B;
            --sh-sm: 0 2px 8px rgba(11, 31, 68, 0.05);
            --sh-md: 0 8px 24px rgba(11, 31, 68, 0.07);
            --sh-lg: 0 18px 42px rgba(11, 31, 68, 0.11);
        }

        :root[data-contrast="outdoor"] {
            --bg-outer: #FFFFFF;
            --bg-shell: #FFFFFF;
            --panel: #FFFFFF;
            --card: #F1F5F9;
            --pill-bg: #E2E8F0;
            --tx: #051026;
            --tx2: #0B1F44;
            --bd: #475569;
            --sh-sm: none;
            --sh-md: 0 0 0 1.5px #0B1F44;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg-outer);
            color: var(--tx);
            font: 15px/1.6 'Montserrat', system-ui, -apple-system, sans-serif;
            font-feature-settings: 'tnum';
            padding: clamp(8px, 1.5vw, 20px);
        }

        button,
        input,
        select,
        textarea {
            font: inherit;
            color: inherit;
        }

        button {
            cursor: pointer;
            transition: all .16s ease;
        }

        button:active:not(:disabled) {
            transform: scale(0.98);
        }

        button:focus-visible,
        input:focus-visible,
        select:focus-visible,
        textarea:focus-visible {
            outline: 2px solid var(--n9);
            outline-offset: 2px;
            box-shadow: 0 0 0 4px var(--c3);
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .anim {
            animation: fadeUp .25s ease both;
        }

        svg.i {
            width: 19px;
            height: 19px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex: none;
        }

        /* Kerangka Utama & Header */
        #shell {
            max-width: 1420px;
            margin: 0 auto;
            background: var(--bg-shell);
            border-radius: 28px;
            padding: clamp(14px, 2vw, 24px);
            box-shadow: var(--sh-lg);
            border: 1px solid var(--bd);
        }

        #topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            background: var(--panel);
            border-radius: 20px;
            padding: 12px 20px;
            box-shadow: var(--sh-sm);
            border: 1px solid var(--bd);
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            border: 0;
            background: none;
            padding: 0;
            text-align: left;
        }

        .brand-logo {
            width: 46px;
            height: 46px;
            flex: none;
        }

        .brand-word {
            display: flex;
            flex-direction: column;
        }

        .brand-word svg {
            height: 22px;
            width: auto;
            display: block;
        }

        .brand-tag {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.12em;
            color: var(--n7);
            margin-top: 3px;
        }

        .top-act {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        /* Tombol & Badge */
        .pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 1.5px solid var(--bd);
            background: var(--panel);
            color: var(--tx);
            border-radius: 12px;
            padding: 9px 16px;
            font-size: 13.5px;
            font-weight: 600;
            min-height: 42px;
        }

        .pill:hover:not(:disabled) {
            background: var(--pill-bg);
        }

        .pill.pr {
            background: var(--n9);
            border-color: var(--n9);
            color: #FFFFFF;
            font-weight: 700;
        }

        .pill.cy {
            background: var(--c5);
            border-color: var(--c5);
            color: #0B1F44;
            font-weight: 700;
        }

        .pill:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .bd {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border-radius: 999px;
            padding: 4px 12px;
            font-size: 12.5px;
            font-weight: 700;
            white-space: nowrap;
        }

        .bd.ver {
            background: #D1FAE5;
            color: #065F46;
            border: 1px solid #A7F3D0;
        }

        .bd.dug {
            background: #FEF3C7;
            color: #92400E;
            border: 1px solid #FDE68A;
        }

        .bd.bukti {
            background: #FFEDD5;
            color: #9A3412;
            border: 1px solid #FED7AA;
        }

        .bd.err {
            background: #FEE2E2;
            color: #991B1B;
            border: 1px solid #FCA5A5;
        }

        .bd.ars {
            background: #E2E8F0;
            color: #334155;
            border: 1px solid #CBD5E1;
        }

        .bd.info {
            background: var(--chip);
            color: var(--n9);
            border: 1px solid var(--c3);
        }

        /* 3 Pilar Badge */
        .p-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .p-tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 11px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            background: var(--pill-bg);
            color: var(--tx);
            border: 1px solid var(--bd);
        }

        /* Workspace: Sidebar Kiri ala MyITS + Area Utama */
        #work {
            display: grid;
            grid-template-columns: 240px minmax(0, 1fr);
            gap: 20px;
            align-items: start;
        }

        #side {
            background: var(--panel);
            border-radius: 20px;
            padding: 14px 10px;
            box-shadow: var(--sh-sm);
            border: 1px solid var(--bd);
            position: sticky;
            top: 16px;
        }

        .s-lbl {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--tx2);
            padding: 8px 12px 6px;
        }

        .s-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            border: 0;
            background: transparent;
            color: var(--tx);
            padding: 11px 12px;
            border-radius: 12px;
            font-size: 13.5px;
            font-weight: 600;
            text-align: left;
            margin-bottom: 4px;
        }

        .s-btn:hover {
            background: var(--pill-bg);
        }

        .s-btn.on {
            background: var(--n9);
            color: #FFFFFF;
            font-weight: 700;
        }

        .s-btn .cnt {
            margin-left: auto;
            font-size: 11.5px;
            font-weight: 700;
            background: var(--pill-bg);
            color: var(--tx);
            padding: 2px 8px;
            border-radius: 99px;
        }

        .s-btn.on .cnt {
            background: var(--c5);
            color: #0B1F44;
        }

        /* Kartu & Tata Letak Bersih */
        .cd {
            background: var(--panel);
            border-radius: 20px;
            padding: 22px 24px;
            box-shadow: var(--sh-sm);
            border: 1px solid var(--bd);
        }

        .kpi4 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(185px, 1fr));
            gap: 14px;
            margin-bottom: 18px;
        }

        .kbox {
            background: var(--panel);
            border: 1px solid var(--bd);
            border-radius: 18px;
            padding: 16px 18px;
        }

        .kbox small {
            display: block;
            font-size: 12.5px;
            font-weight: 600;
            color: var(--tx2);
        }

        .kbox b {
            display: block;
            font-size: 28px;
            font-weight: 800;
            color: var(--tx);
            margin: 4px 0 2px;
        }

        .kbox span {
            font-size: 12.5px;
            font-weight: 600;
            color: var(--tx2);
        }

        .dg {
            display: grid;
            gap: 18px;
            grid-template-columns: minmax(0, 1.75fr) minmax(0, 1fr);
            align-items: start;
        }

        .row2 {
            display: grid;
            gap: 16px;
            grid-template-columns: repeat(auto-fit, minmax(min(100%, 310px), 1fr));
        }

        .chd {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        h2 {
            margin: 0;
            font-size: 17px;
            font-weight: 700;
            color: var(--tx);
        }

        .csub {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--tx2);
            margin-top: 2px;
        }

        .mu {
            color: var(--tx2) !important;
            font-weight: 500 !important;
        }

        .nt {
            margin: 12px 0 0;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 13.5px;
            font-weight: 600;
            color: #7C2D12;
            background: #FEF3C7;
            border: 1px solid #FDE68A;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            background: var(--pill-bg);
            padding: 5px;
            border-radius: 14px;
            margin-bottom: 16px;
            width: fit-content;
            max-width: 100%;
        }

        .tabs button {
            border: 0;
            background: none;
            border-radius: 10px;
            padding: 8px 15px;
            min-height: 38px;
            font-size: 13.5px;
            font-weight: 600;
            color: var(--tx2);
        }

        .tabs .on {
            background: var(--n9);
            color: #FFFFFF;
            font-weight: 700;
        }

        /* Tabel Lega & Mudah Dibaca */
        .tbl-wrap {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 6px;
            font-size: 14px;
        }

        th {
            text-align: left;
            font-size: 12.5px;
            font-weight: 700;
            color: var(--tx2);
            padding: 6px 12px;
        }

        td {
            padding: 12px;
            background: var(--card);
            border-top: 1px solid var(--bd);
            border-bottom: 1px solid var(--bd);
        }

        td:first-child {
            border-left: 1px solid var(--bd);
            border-radius: 12px 0 0 12px;
        }

        td:last-child {
            border-right: 1px solid var(--bd);
            border-radius: 0 12px 12px 0;
            text-align: right;
        }

        /* Form & Input */
        .lbl {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: var(--tx);
            margin: 12px 0 6px;
        }

        .in2,
        select,
        textarea {
            width: 100%;
            border: 1.5px solid var(--bd);
            background: var(--card);
            color: var(--tx);
            border-radius: 10px;
            padding: 9px 12px;
            font-size: 14px;
            min-height: 42px;
        }

        textarea {
            min-height: 76px;
            resize: vertical;
        }

        .ec {
            background: var(--card);
            border: 1px solid var(--bd);
            border-radius: 14px;
            padding: 14px 16px;
            margin-bottom: 10px;
        }

        .hh {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
            font-weight: 700;
            font-size: 14px;
        }

        .rc {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            padding: 11px 14px;
            border: 1.5px solid var(--bd);
            border-radius: 12px;
            background: var(--card);
            cursor: pointer;
            font-size: 13.5px;
            font-weight: 600;
        }

        .rc.on {
            border-color: var(--n9);
            background: var(--chip);
        }

        .rc input {
            width: 17px;
            height: 17px;
            margin-top: 2px;
            accent-color: var(--n9);
            flex: none;
        }

        /* Linimasa 7 Entitas & Stepper */
        .tl {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .tl li {
            display: grid;
            grid-template-columns: 36px 1fr;
            gap: 14px;
            padding-bottom: 18px;
            position: relative;
        }

        .tl li:before {
            content: '';
            position: absolute;
            left: 17px;
            top: 36px;
            bottom: 2px;
            width: 2px;
            background: var(--c5);
        }

        .tl li.h:before {
            background: repeating-linear-gradient(180deg, var(--dug) 0 5px, transparent 5px 10px);
        }

        .tl li:last-child:before {
            display: none;
        }

        .tl .n {
            display: grid;
            place-items: center;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--chip);
            color: var(--n9);
            font-weight: 800;
            font-size: 13.5px;
        }

        .stp {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
            gap: 8px;
            margin: 12px 0;
        }

        .st-i {
            padding: 10px 12px;
            border-radius: 12px;
            border: 1.5px solid var(--bd);
            background: var(--card);
            font-size: 12.5px;
        }

        .st-i b {
            display: block;
            font-size: 13px;
            margin-bottom: 2px;
        }

        .st-i.done {
            border-color: var(--ok);
            background: #ECFDF5;
            color: #065F46;
        }

        .st-i.cur {
            border-color: var(--n9);
            background: var(--chip);
            color: var(--n9);
        }

        /* Asset Repository & Knowledge Graph Terpisah (Anti-Salah-Pencet) */
        .kg-shell {
            display: grid;
            grid-template-columns: 340px minmax(0, 1fr);
            gap: 20px;
            align-items: start;
        }

        .repo-cat {
            border: 1.5px solid var(--bd);
            border-radius: 14px;
            background: var(--card);
            margin-bottom: 10px;
            overflow: hidden;
        }

        .repo-cat-h {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 14px;
            cursor: pointer;
            font-weight: 700;
        }

        .repo-unit {
            border-top: 1px solid var(--bd);
            background: var(--panel);
            padding: 8px 10px;
        }

        .repo-u-btn {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            border: 1.5px solid var(--bd);
            background: var(--card);
            border-radius: 10px;
            padding: 9px 12px;
            font-weight: 700;
            font-size: 13.5px;
        }

        .repo-u-btn.on {
            border-color: var(--c5);
            background: var(--chip);
        }

        .repo-sub {
            padding: 6px 4px 2px 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .repo-s-btn {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            border: 0;
            background: transparent;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            text-align: left;
        }

        .repo-s-btn:hover {
            background: var(--pill-bg);
        }

        .repo-s-btn.on {
            background: var(--n9);
            color: #FFFFFF;
        }

        .gw {
            overflow-x: auto;
            padding-bottom: 6px;
        }

        .gw svg {
            min-width: 620px;
            width: 100%;
            height: auto;
            display: block;
        }

        .gw text {
            fill: var(--tx);
            font-size: 11.5px;
            font-weight: 700;
        }

        .gw .lb2 {
            font-size: 10.5px;
            font-weight: 600;
            fill: var(--tx2);
        }

        .gn {
            cursor: pointer;
        }

        /* Modal & Login */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(11, 31, 68, 0.7);
            backdrop-filter: blur(4px);
            z-index: 999;
            display: grid;
            place-items: center;
            padding: 16px;
        }

        .modal-backdrop[hidden] {
            display: none !important;
        }

        .modal-box {
            background: var(--panel);
            border-radius: 22px;
            max-width: 780px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 24px;
            box-shadow: var(--sh-lg);
            border: 1px solid var(--bd);
        }

        #login-view {
            min-height: 92vh;
            display: grid;
            place-items: center;
            padding: 20px;
        }

        #login-view[hidden] {
            display: none !important;
        }

        .login-card {
            background: var(--panel);
            border: 1px solid var(--bd);
            border-radius: 24px;
            max-width: 430px;
            width: 100%;
            padding: 32px 28px;
            box-shadow: var(--sh-lg);
            text-align: center;
        }

        #ts {
            position: fixed;
            left: 50%;
            transform: translateX(-50%);
            bottom: 24px;
            background: var(--n9);
            color: #FFFFFF;
            border: 2px solid var(--c3);
            padding: 11px 20px;
            border-radius: 999px;
            opacity: 0;
            pointer-events: none;
            transition: opacity .2s;
            z-index: 1000;
            font-size: 13.5px;
            font-weight: 600;
        }

        #ts.on {
            opacity: 1;
        }

        /* Responsif Tablet & HP (Mobile-First Lapangan) */
        @media (max-width: 1040px) {

            .dg,
            .kg-shell {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 860px) {
            body {
                padding: 6px;
            }

            #shell {
                border-radius: 20px;
                padding: 12px;
                padding-bottom: 86px;
            }

            #work {
                grid-template-columns: 1fr;
            }

            #side {
                position: fixed;
                bottom: 8px;
                left: 8px;
                right: 8px;
                top: auto;
                z-index: 90;
                display: flex;
                gap: 4px;
                overflow-x: auto;
                padding: 6px;
                border-radius: 16px;
                border: 1.5px solid var(--n9);
                box-shadow: var(--sh-lg);
            }

            .s-lbl,
            .s-btn .cnt {
                display: none;
            }

            .s-btn {
                flex-direction: column;
                gap: 3px;
                padding: 8px;
                font-size: 11px;
                text-align: center;
                min-width: 72px;
                margin: 0;
                justify-content: center;
            }
        }
    </style>
</head>

<body>

    <!-- LAYAR LOGIN (SISTEM AKSES & KEAMANAN WEB) -->
    <div id="login-view" hidden>
        <div class="login-card anim">
            <div style="display:flex;justify-content:center;margin-bottom:14px">
                <!-- Simbol Resmi S-Helm SYNQRA -->
                <svg viewBox="0 0 100 100" style="width:68px;height:68px" aria-hidden="true">
                    <path d="M22 42 C22 18, 45 8, 66 16 C79 21, 86 33, 88 46 L79 41 C65 37, 42 36, 28 38 Z"
                        fill="#0B1F44" />
                    <path d="M40 24 C48 16, 62 19, 68 33 C59 24, 48 22, 40 24 Z" fill="#FFFFFF" />
                    <path d="M56 17 C65 18, 73 25, 76 35 C70 27, 63 22, 56 17 Z" fill="#1E4B6B" />
                    <path d="M22 42 L76 62 C85 66, 85 78, 74 84 L52 94 L36 85 L62 72 L24 56 C18 53, 18 46, 22 42 Z"
                        fill="#0B1F44" />
                    <path d="M20 62 L56 80 L42 90 C30 86, 20 77, 20 62 Z" fill="#00B8D9" />
                </svg>
            </div>
            <h1 style="margin:0;font-size:24px;font-weight:800;letter-spacing:0.04em">SYNQRA</h1>
            <p class="mu" style="font-size:12px;margin:4px 0 18px">Intelligence Connected by Evidence · Sistem Akses
                Terotorisasi</p>

            <div style="text-align:left;margin-bottom:16px">
                <span class="lbl" style="margin-top:0">Pilih Peran Akses (Simulasi Hak Akses):</span>
                <div id="login-personas" style="display:grid;gap:8px"></div>
            </div>
            <button class="pill pr" style="width:100%;justify-content:center" onclick="doLogin()">Masuk ke Sistem
                ›</button>
        </div>
    </div>

    <!-- KERANGKA UTAMA APLIKASI -->
    <div id="shell">
        <header id="topbar">
            <!-- LOGO HORIZONTAL RESMI SYNQRA (S-HELM + WORDMARK Q CYAN) -->
            <button class="brand" data-go="beranda" aria-label="SYNQRA Beranda">
                <svg class="brand-logo" viewBox="0 0 100 100" aria-hidden="true">
                    <path d="M22 42 C22 18, 45 8, 66 16 C79 21, 86 33, 88 46 L79 41 C65 37, 42 36, 28 38 Z"
                        fill="#0B1F44" />
                    <path d="M40 24 C48 16, 62 19, 68 33 C59 24, 48 22, 40 24 Z" fill="#FFFFFF" />
                    <path d="M56 17 C65 18, 73 25, 76 35 C70 27, 63 22, 56 17 Z" fill="#1E4B6B" />

        function openIncidentPhoto(caseId, idx) {
            const b = CD[caseId].bk[idx];
            const svg = INC_SVG[b[4]] || INC_SVG.doc;
            $('#modal-box').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div>
        <span class="bd info">${esc(b[0])} · Kasus ${caseId}</span>
        <h2 style="margin-top:6px">${esc(b[1])}</h2>
      </div>
      <button class="pill" onclick="closeModal()">Tutup ×</button>
    </div>
    <div style="border-radius:14px;overflow:hidden;margin-bottom:14px">${svg}</div>
    <div class="ec">
      <b>Rujukan Jurnal & Standar Industri:</b> ${esc(b[3])}<br>
      <small class="mu">Fungsi Bukti: Mendukung klaim <b>${b[2]}</b> pada proses validasi pakar.</small>
    </div>
  `;
            $('#modal-backdrop').hidden = false;
        }

        function openColorModal() {
            $('#modal-box').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <h2>Psikologi Warna & 3 Pilar Utama SYNQRA</h2>
      <button class="pill" onclick="closeModal()">Tutup ×</button>

      <div style="padding:12px 14px;border-radius:12px;background:#D1FAE5;color:#065F46;border:1px solid #A7F3D0"><b>Emerald Green (#10B981):</b> Pengetahuan yang telah disahkan pakar dengan bukti lengkap di Knowledge Base.</div>
    </div>

            $('#modal-backdrop').hidden = false;
        }

        function closeModal() { $('#modal-backdrop').hidden = true; }
        window.addEventListener('click', e => { if (e.target === $('#modal-backdrop')) closeModal(); });

        /* ROUTER UTAMA */
        function route() {
            const h = location.hash.slice(1) || 'beranda';
            if (h === 'login') {
                $('#shell').hidden = true; $('#login-view').hidden = false; renderLoginPersonas(); return;
            }
            $('#shell').hidden = false; $('#login-view').hidden = true;
            const map = {
                beranda: renderHome,
                prelim: renderPrelim,
                investigasi: renderInvestigasi,
                graf: renderGraf,
                cari: renderCari
            };
            const key = map[h] ? h : 'beranda';
            renderSide(key);
            map[key]();
            scrollTo(0, 0);
        }
        addEventListener('hashchange', route);
        route();
    </script>
